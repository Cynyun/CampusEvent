server:
  port: 8080
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: campusevent-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campusevent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL80KEY:}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.Cynyun.campusevent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
    com.Cynyun: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
