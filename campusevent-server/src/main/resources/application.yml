server:
  port: 8080
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: campusevent-server

  # 默认 SQLite；需要 MySQL 时用 --spring.profiles.active=mysql 或环境变量 SPRING_PROFILES_ACTIVE=mysql
  profiles:
    default: sqlite

  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    static-path-pattern: /**

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.Cynyun.campusevent.entity
  type-handlers-package: com.Cynyun.campusevent.config.mybatis
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    root: info
    com.Cynyun: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true

app:
  # 只在数据库为空且首次运行时写入演示活动/学生/报名；已有数据不会重复写入
  seed-demo-data: ${CAMPUSEVENT_SEED_DEMO:true}
  mock-email:
    # 仅用于验收 CR2-03：置 true 时模拟邮件失败，不影响报名
    fail: ${CAMPUSEVENT_MOCK_EMAIL_FAIL:false}